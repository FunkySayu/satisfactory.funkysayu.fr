server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  gzip_min_length 1024;

  # the page: always revalidate so a new build shows up at once
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }

  # hashed bundles never change
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # static game data: icons rarely change, gamedata.json follows game updates
  location /icons/ { add_header Cache-Control "public, max-age=604800"; }
  location = /gamedata.json { add_header Cache-Control "public, max-age=3600"; }

  # optional data folder (volume): saves, blueprint archives, snapshots.
  # Open them with ?url=/data/latest.sav&live_reload=1 ; live reload compares ETag / Last-Modified.
  # CORS lets the Satisfactory Calculator map (and pages on other hosts) read them too.
  location /data/ {
    alias /srv/data/;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "ETag, Last-Modified, Content-Length" always;
  }
}
